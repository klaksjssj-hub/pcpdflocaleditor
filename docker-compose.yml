version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: localpdf-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - MAX_FILE_SIZE=104857600
      - FILE_RETENTION_HOURS=24
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/localpdf
    volumes:
      - server-uploads:/app/uploads
      - server-processed:/app/processed
      - server-data:/app/data
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: localpdf-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

  db:
    image: postgres:16-alpine
    container_name: localpdf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localpdf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  server-uploads:
  server-processed:
  server-data:
  pgdata:
